# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
# kotlin.mpp.applyDefaultHierarchyTemplate defaults to true (matches Sunny/Chirp).
# kotlin.native.cacheKind defaults to full caching (matches Sunny/Chirp). The Plan 1A
# "workaround" turned out to CAUSE the iOS IR linker fake-override bug, not solve it.

# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# CMP
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=false
